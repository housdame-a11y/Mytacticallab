<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0c1116" />
<title>Tactical Lab</title>
<style>
  /* ═══════════════════ TOKENS ═══════════════════ */
  :root{
    --bg:#060a0f; --bg2:#0b1118; --surface:#101922; --surface2:#162030; --surface3:#1c2a3e;
    --line:#1d3048; --line2:#243a56; --text:#eef4fc; --text2:#b0c8e0; --muted:#567a94;
    --accent:#00e5a0; --accent2:#00b87e; --accent3:rgba(0,229,160,.08);
    --danger:#ff4f72; --warn:#ffa726; --blue:#448aff; --purple:#b388ff;
    --pitch:#1b6b40; --pitch2:#165835;
    --radius:18px; --radius-sm:12px; --nav-h:62px; --hdr-h:60px;
    --shadow:0 8px 28px rgba(0,0,0,.55); --glow:0 0 24px rgba(0,229,160,.22);
  }

  /* ═══════════════════ RESET ═══════════════════ */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{height:100%;background:var(--bg);}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:var(--text);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;}

  /* ═══════════════════ SHELL ═══════════════════ */
  #app{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}

  /* HEADER */
  .app-header{
    height:var(--hdr-h);min-height:var(--hdr-h);
    display:flex;align-items:center;gap:10px;padding:0 18px;
    padding-top:env(safe-area-inset-top);
    background:rgba(6,10,15,.88);backdrop-filter:blur(24px);
    border-bottom:1px solid var(--line);flex-shrink:0;z-index:30;
  }
  .app-header .back{
    width:38px;height:38px;border-radius:11px;border:1px solid var(--line2);
    background:var(--surface2);color:var(--text2);display:none;align-items:center;justify-content:center;
    font-size:22px;cursor:pointer;flex:0 0 auto;
  }
  .app-header.has-back .back{display:flex;}
  .app-header.has-back .logo-dot{display:none;}
  .logo-dot{
    width:30px;height:30px;border-radius:9px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;box-shadow:var(--glow);
  }
  .logo-dot svg{width:14px;height:14px;color:#002a1a;}
  .app-header h1{
    font-size:17px;font-weight:800;flex:1;letter-spacing:-.2px;
    background:linear-gradient(120deg,var(--text) 50%,var(--muted));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  .header-action{
    display:none;border:none;background:var(--accent);color:#002a1a;font-weight:800;
    padding:8px 14px;border-radius:10px;font-size:13px;cursor:pointer;
    box-shadow:0 2px 12px rgba(0,229,160,.3);
  }
  .settings-btn{
    width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);
    background:var(--surface2);color:var(--muted);display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .15s;
  }
  .settings-btn svg{width:16px;height:16px;}

  /* NAV */
  .bottom-nav{
    height:calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    display:flex;background:rgba(6,10,15,.92);backdrop-filter:blur(24px);
    border-top:1px solid var(--line);flex-shrink:0;z-index:30;
  }
  .bottom-nav.hidden{display:none;}
  .nav-btn{
    flex:1;background:none;border:none;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    font-size:10px;cursor:pointer;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
    position:relative;transition:color .2s;
  }
  .nav-btn svg{width:22px;height:22px;transition:transform .2s;}
  .nav-btn.active{color:var(--accent);}
  .nav-btn.active svg{transform:translateY(-1px);}
  .nav-btn.active::after{
    content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:20px;height:2px;background:var(--accent);border-radius:0 0 3px 3px;
    box-shadow:0 0 10px var(--accent);
  }

  /* SCREEN */
  .screen-wrap{flex:1;overflow:hidden;position:relative;}
  .screen{
    position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:20px 16px calc(var(--nav-h) + 32px);
    opacity:0;visibility:hidden;transform:translateY(6px);
    transition:opacity .2s ease,transform .2s ease;
  }
  .screen.active{opacity:1;visibility:visible;transform:none;}
  .screen.no-nav{padding-bottom:24px;}
  .screen.pitch-wrap{overflow:hidden;padding:0;}

  /* ═══════════════════ HOME ═══════════════════ */
  .home-hero{
    border-radius:var(--radius);margin-bottom:16px;position:relative;overflow:hidden;
    background:linear-gradient(135deg,rgba(0,229,160,.09) 0%,rgba(68,138,255,.06) 60%,rgba(179,136,255,.04) 100%);
    border:1px solid rgba(0,229,160,.13);
  }
  .home-hero::before{content:'';position:absolute;top:-50px;right:-30px;width:160px;height:160px;background:radial-gradient(circle,rgba(0,229,160,.13),transparent 65%);border-radius:50%;pointer-events:none;}
  .home-hero-inner{padding:22px 20px;position:relative;}
  .phase-tag{display:inline-flex;align-items:center;gap:5px;background:rgba(0,229,160,.1);border:1px solid rgba(0,229,160,.22);color:var(--accent);font-size:10px;font-weight:800;padding:3px 10px;border-radius:20px;margin-bottom:10px;letter-spacing:.6px;text-transform:uppercase;}
  .home-hero h2{font-size:23px;font-weight:900;letter-spacing:-.3px;margin-bottom:4px;line-height:1.15;}
  .home-hero p{color:var(--muted);font-size:13px;}

  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;}
  .stat .num{font-size:24px;font-weight:900;color:var(--accent);line-height:1;}
  .stat .lbl{font-size:10px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .action-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 14px;cursor:pointer;display:flex;flex-direction:column;gap:12px;min-height:108px;
    position:relative;overflow:hidden;transition:border-color .2s,transform .12s;
  }
  .action-card:active{transform:scale(.97);border-color:rgba(0,229,160,.3);}
  .action-card .ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(0,229,160,.1);color:var(--accent);}
  .action-card .ico svg{width:22px;height:22px;}
  .action-card h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.1px;}
  .action-card-wide{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:border-color .2s,transform .12s;}
  .action-card-wide:active{transform:scale(.98);border-color:rgba(179,136,255,.3);}
  .action-card-wide .ico{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(179,136,255,.1);color:var(--purple);flex:0 0 auto;}
  .action-card-wide .ico svg{width:20px;height:20px;}
  .action-card-wide h3{font-size:14px;font-weight:800;margin-bottom:2px;}
  .action-card-wide p{font-size:12px;color:var(--muted);}

  /* ═══════════════════ BUTTONS ═══════════════════ */
  .btn{border:none;border-radius:var(--radius-sm);padding:15px 18px;font-size:15px;font-weight:800;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.1px;transition:transform .12s;}
  .btn:active{transform:scale(.98);}
  .btn svg{width:18px;height:18px;flex:0 0 auto;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#002a1a;box-shadow:0 4px 16px rgba(0,229,160,.28);}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line2);}
  .btn-danger{background:rgba(255,79,114,.1);color:var(--danger);border:1px solid rgba(255,79,114,.25);}
  .btn-row{display:flex;gap:8px;}
  .btn-sm{padding:10px 14px;font-size:13px;border-radius:10px;width:auto;}

  /* ═══════════════════ SEARCH ═══════════════════ */
  .search-bar{position:relative;margin-bottom:14px;}
  .search-bar input{width:100%;padding:13px 14px 13px 44px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:15px;outline:none;transition:border-color .2s;}
  .search-bar input:focus{border-color:rgba(0,229,160,.4);}
  .search-bar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);}

  /* ═══════════════════ LISTS ═══════════════════ */
  .list{display:flex;flex-direction:column;gap:8px;}
  .item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:12px;transition:border-color .18s;}
  .item:active{border-color:rgba(0,229,160,.3);}
  .pos-badge{width:40px;height:40px;flex:0 0 40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;background:var(--surface2);border:1px solid var(--line2);color:var(--text2);letter-spacing:.3px;}
  .item .info{flex:1;min-width:0;}
  .item .info .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
  .item .info .sub{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .item .acts{display:flex;gap:6px;flex:0 0 auto;}
  .icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
  .icon-btn svg{width:16px;height:16px;}
  .icon-btn.danger:active{border-color:var(--danger);color:var(--danger);}

  /* ═══════════════════ EMPTY STATE ═══════════════════ */
  .empty{text-align:center;padding:56px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .empty svg{width:48px;height:48px;color:var(--muted);opacity:.3;}
  .empty p{margin:0;font-size:13px;color:var(--muted);line-height:1.5;}

  /* ═══════════════════ SHEET ═══════════════════ */
  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px);}
  .sheet-overlay.open{display:flex;}
  .sheet{
    width:100%;max-width:430px;
    background:linear-gradient(180deg,var(--surface2) 0%,var(--bg2) 100%);
    border-radius:24px 24px 0 0;border:1px solid var(--line2);border-bottom:none;
    padding:20px 18px calc(24px + env(safe-area-inset-bottom));
    max-height:92dvh;overflow-y:auto;animation:slideUp .24s cubic-bezier(.34,1.2,.64,1);
  }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 20px;}
  .sheet h3{margin:0 0 18px;font-size:20px;font-weight:900;letter-spacing:-.3px;}

  /* FIELDS */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:7px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;}
  .field input,.field select,.field textarea{width:100%;padding:13px 15px;border-radius:var(--radius-sm);border:1px solid var(--line2);background:var(--surface);color:var(--text);font-size:15px;outline:none;transition:border-color .2s;font-family:inherit;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(0,229,160,.45);}
  .field textarea{resize:none;min-height:88px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}

  .pos-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .pos-opt{padding:11px 0;text-align:center;border-radius:9px;border:1px solid var(--line2);background:var(--surface);font-weight:800;font-size:12px;cursor:pointer;color:var(--muted);transition:all .15s;}
  .pos-opt.sel{background:var(--accent);color:#002a1a;border-color:var(--accent);}

  .combo{position:relative;}
  .combo-input{width:100%;padding:13px 15px;border-radius:var(--radius-sm);border:1px solid var(--line2);background:var(--surface);color:var(--text);font-size:15px;outline:none;transition:border-color .2s;font-family:inherit;}
  .combo-input:focus{border-color:rgba(0,229,160,.45);}
  .combo-list{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface2);border:1px solid var(--line2);border-radius:14px;max-height:220px;overflow-y:auto;z-index:10;display:none;box-shadow:0 16px 48px rgba(0,0,0,.7);}
  .combo-list.open{display:block;}
  .combo-opt{padding:12px 15px;font-size:14px;cursor:pointer;border-bottom:1px solid rgba(30,50,72,.5);}
  .combo-opt:last-child{border-bottom:none;}
  .combo-opt.hl{background:var(--accent);color:#002a1a;}
  .combo-empty{padding:14px;color:var(--muted);font-size:13px;text-align:center;}

  .select-row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:border-color .15s,background .15s;}
  .select-row.sel{border-color:var(--accent);background:rgba(0,229,160,.07);}
  .check{width:22px;height:22px;border-radius:6px;border:2px solid var(--line2);flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .select-row.sel .check{background:var(--accent);border-color:var(--accent);}
  .check svg{width:13px;height:13px;color:#002a1a;display:none;}
  .select-row.sel .check svg{display:block;}

  /* ═══════════════════ MISC ═══════════════════ */
  .section-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:800;margin:20px 0 10px;}
  .counter-pill{position:sticky;top:0;z-index:4;background:var(--bg);padding:4px 0 12px;}
  .counter-pill .pill{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;}
  .counter-pill .pill .c{color:var(--accent);}

  /* TAGS */
  .tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;}
  .tag-green{background:rgba(0,229,160,.1);color:var(--accent);border:1px solid rgba(0,229,160,.2);}
  .tag-blue{background:rgba(68,138,255,.1);color:var(--blue);border:1px solid rgba(68,138,255,.2);}
  .tag-red{background:rgba(255,79,114,.1);color:var(--danger);border:1px solid rgba(255,79,114,.2);}
  .tag-warn{background:rgba(255,167,38,.1);color:var(--warn);border:1px solid rgba(255,167,38,.2);}
  .tag-muted{background:var(--surface2);color:var(--muted);border:1px solid var(--line2);}

  /* AVATARS */
  .player-avatar{flex:0 0 auto;border-radius:11px;overflow:hidden;background:var(--surface2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;}
  .player-avatar img{width:100%;height:100%;object-fit:cover;object-position:top center;}
  .player-avatar svg{opacity:.25;color:var(--muted);}
  .av-sm{width:42px;height:42px;}
  .av-sm svg{width:22px;height:22px;}
  .av-md{width:56px;height:56px;border-radius:14px;}
  .av-md svg{width:28px;height:28px;}
  .av-lg{width:72px;height:72px;border-radius:16px;}
  .av-lg svg{width:34px;height:34px;}

  /* FITNESS */
  .fitness-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  .fit-ok{background:var(--accent);box-shadow:0 0 6px rgba(0,229,160,.5);}
  .fit-doubt{background:var(--warn);}
  .fit-inj{background:var(--danger);}

  /* PHOTO UPLOAD */
  .photo-upload-row{display:flex;gap:12px;align-items:center;margin-top:6px;}
  .photo-thumb{width:64px;height:64px;flex:0 0 64px;border-radius:14px;overflow:hidden;background:var(--surface2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;}
  .photo-thumb svg{width:28px;height:28px;opacity:.3;color:var(--muted);}
  .photo-inputs{flex:1;display:flex;flex-direction:column;gap:6px;}
  .upload-label{font-size:13px;padding:9px 13px;border-radius:9px;}

  /* SQUAD */
  .squad-total{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px;}
  .pos-group{margin-bottom:22px;}
  .pos-group-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .pos-group-header span:first-child{font-size:12px;font-weight:900;color:var(--accent);text-transform:uppercase;letter-spacing:.7px;}
  .pos-group-count{font-size:11px;font-weight:700;background:var(--surface2);border:1px solid var(--line2);border-radius:20px;padding:2px 9px;color:var(--muted);}

  /* IMPORT */
  .import-card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:8px;transition:border-color .15s;}
  .import-card:active{border-color:rgba(0,229,160,.35);}

  /* PROFILE */
  .profile-hero{margin-bottom:16px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,rgba(0,229,160,.07),rgba(68,138,255,.04));}
  .profile-hero-inner{padding:20px;display:flex;gap:16px;align-items:flex-start;}
  .ph-name{font-size:20px;font-weight:900;letter-spacing:-.3px;margin-bottom:5px;line-height:1.1;}
  .ph-sub{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
  .ph-tags{display:flex;gap:6px;flex-wrap:wrap;}

  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .stat-cell{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px 8px;text-align:center;}
  .stat-cell .sc-n{font-size:22px;font-weight:900;color:var(--accent);line-height:1;}
  .stat-cell .sc-l{font-size:9px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;}

  .rating-bar-wrap{margin-bottom:10px;}
  .rating-bar-wrap .rb-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
  .rating-bar-wrap .rb-row span:first-child{color:var(--muted);}
  .rating-bar-wrap .rb-row span:last-child{font-weight:800;color:var(--text);}
  .rbar{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;}
  .rbar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .6s ease;}

  .api-box{background:linear-gradient(135deg,rgba(68,138,255,.09),rgba(68,138,255,.04));border:1px solid rgba(68,138,255,.2);border-radius:13px;padding:14px;margin-bottom:12px;}
  .api-box-hdr{display:flex;align-items:center;gap:8px;margin-bottom:11px;}
  .api-box-hdr span{font-size:11px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.6px;}
  .api-spin{width:14px;height:14px;border:2px solid rgba(68,138,255,.2);border-top-color:var(--blue);border-radius:50%;animation:spin .65s linear infinite;flex:0 0 auto;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .api-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(30,50,72,.6);font-size:13px;}
  .api-row:last-child{border-bottom:none;}
  .api-row .ar-l{color:var(--muted);}
  .api-row .ar-v{font-weight:800;color:var(--text);}

  .form-dots{display:flex;gap:6px;margin-top:8px;}
  .fd{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
  .fd-W{background:rgba(0,229,160,.15);color:var(--accent);}
  .fd-D{background:rgba(255,167,38,.15);color:var(--warn);}
  .fd-L{background:rgba(255,79,114,.15);color:var(--danger);}
  .fd-empty{background:var(--surface2);color:var(--muted);}

  .fitness-sel{display:flex;gap:8px;margin-top:8px;}
  .fit-opt{flex:1;padding:11px 6px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);text-align:center;cursor:pointer;font-size:12px;font-weight:700;transition:all .15s;color:var(--muted);}
  .fit-ok-sel{background:rgba(0,229,160,.1);border-color:var(--accent);color:var(--accent);}
  .fit-doubt-sel{background:rgba(255,167,38,.1);border-color:var(--warn);color:var(--warn);}
  .fit-inj-sel{background:rgba(255,79,114,.1);border-color:var(--danger);color:var(--danger);}

  /* COMPARE */
  .cmp-bar-row{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px;}
  .cmp-val{font-size:13px;font-weight:800;min-width:28px;}
  .cmp-val-l{text-align:right;color:var(--accent);}
  .cmp-val-r{color:var(--blue);}
  .cmp-bar{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;}
  .cmp-fill-l{height:100%;border-radius:4px;float:right;background:linear-gradient(90deg,var(--accent2),var(--accent));}
  .cmp-fill-r{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue),#1a5ccc);}

  /* SETTINGS */
  .setting-section{margin-bottom:24px;}
  .setting-section h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:800;margin-bottom:10px;}
  .setting-row{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px 15px;display:flex;align-items:center;gap:13px;margin-bottom:8px;cursor:pointer;transition:border-color .2s;}
  .setting-row:active{border-color:rgba(0,229,160,.3);}
  .sr-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .sr-ico svg{width:18px;height:18px;}
  .sr-info{flex:1;}
  .sr-info strong{display:block;font-size:14px;font-weight:700;color:var(--text);}
  .sr-info span{font-size:12px;color:var(--muted);margin-top:1px;display:block;}
  .api-key-wrap{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:8px;}
  .api-key-input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);color:var(--text);font-size:13px;outline:none;font-family:'SF Mono','Fira Code',monospace;transition:border-color .2s;margin-top:10px;letter-spacing:.5px;}
  .api-key-input:focus{border-color:rgba(0,229,160,.4);}
  .api-status-row{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12px;font-weight:700;color:var(--muted);}
  .api-status-dot{width:7px;height:7px;border-radius:50%;}

  /* ═══════════════════ PITCH ═══════════════════ */
  .pitch-screen{display:flex;flex-direction:column;position:absolute;inset:0;overflow:hidden;background:var(--bg);}
  .formation-bar{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0;}
  .formation-bar::-webkit-scrollbar{display:none;}
  .form-chip{flex:0 0 auto;padding:8px 13px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);color:var(--muted);font-weight:800;font-size:12px;cursor:pointer;transition:all .15s;}
  .form-chip.sel{background:var(--accent);color:#002a1a;border-color:var(--accent);box-shadow:0 2px 10px rgba(0,229,160,.3);}

  .md-stats{display:flex;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0;}
  .md-stat{flex:1;padding:8px 4px;text-align:center;border-right:1px solid var(--line);}
  .md-stat:last-child{border-right:none;}
  .md-stat .n{font-size:16px;font-weight:900;color:var(--accent);}
  .md-stat .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;font-weight:700;}

  .pitch-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .pitch-holder{display:flex;align-items:center;justify-content:center;padding:10px 14px 6px;}
  .pitch{
    position:relative;width:100%;max-width:380px;aspect-ratio:68/105;border-radius:14px;
    background:repeating-linear-gradient(0deg,var(--pitch) 0 9.5%,var(--pitch2) 9.5% 19%);
    border:2px solid rgba(255,255,255,.38);overflow:hidden;touch-action:none;
    box-shadow:0 8px 32px rgba(0,0,0,.5);
  }
  .pitch .line{position:absolute;background:rgba(255,255,255,.38);}
  .pitch .halfway{left:0;right:0;top:50%;height:1.5px;}
  .pitch .center-circle{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;border:1.5px solid rgba(255,255,255,.38);border-radius:50%;transform:translate(-50%,-50%);}
  .pitch .center-spot{position:absolute;left:50%;top:50%;width:5px;height:5px;background:rgba(255,255,255,.6);border-radius:50%;transform:translate(-50%,-50%);}
  .pitch .box{position:absolute;left:50%;transform:translateX(-50%);border:1.5px solid rgba(255,255,255,.38);width:58%;height:14%;}
  .pitch .box.top{top:0;border-top:none;}
  .pitch .box.bottom{bottom:0;border-bottom:none;}
  .pitch .box-sm{position:absolute;left:50%;transform:translateX(-50%);border:1.5px solid rgba(255,255,255,.38);width:30%;height:6%;}
  .pitch .box-sm.top{top:0;border-top:none;}
  .pitch .box-sm.bottom{bottom:0;border-bottom:none;}
  .pitch.drag-over{box-shadow:0 0 0 3px var(--accent) inset,0 8px 32px rgba(0,0,0,.5);}

  /* Markers */
  .marker{position:absolute;transform:translate(-50%,-50%);width:14%;max-width:60px;display:flex;flex-direction:column;align-items:center;gap:3px;touch-action:none;cursor:grab;z-index:2;}
  .marker.dragging{z-index:9;cursor:grabbing;opacity:.9;}
  .marker .dot{width:40px;height:40px;border-radius:50%;background:var(--bg);border:2.5px solid var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.5);overflow:hidden;}
  .marker .dot img{width:100%;height:100%;object-fit:cover;object-position:top center;border-radius:50%;}
  .marker.dragging .dot{transform:scale(1.15);box-shadow:0 8px 24px rgba(0,0,0,.6);}
  .marker .nm{font-size:9px;font-weight:700;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);padding:2px 6px;border-radius:5px;max-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;text-align:center;}
  .marker .pos-lbl{font-size:8px;color:rgba(0,229,160,.8);font-weight:800;}

  /* Draw toolbar */
  .draw-toolbar{display:none;flex-shrink:0;flex-direction:column;background:var(--bg2);border-bottom:1px solid var(--line);}
  .draw-toolbar.visible{display:flex;}
  .draw-toolbar-row{display:flex;align-items:center;gap:5px;padding:7px 12px;overflow-x:auto;}
  .draw-toolbar-row::-webkit-scrollbar{display:none;}
  .draw-toolbar-row+.draw-toolbar-row{border-top:1px solid var(--line);}
  .tool-btn{flex:0 0 36px;height:36px;border-radius:9px;border:1px solid var(--line2);background:var(--surface2);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
  .tool-btn svg{width:16px;height:16px;}
  .tool-btn.sel{background:var(--accent);color:#002a1a;border-color:var(--accent);}
  .tool-btn.t-danger{color:var(--danger);}
  .col-sw{flex:0 0 26px;height:26px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:transform .12s,border-color .12s;}
  .col-sw.sel{border-color:#fff;transform:scale(1.2);}
  .sz-pill{flex:0 0 auto;padding:7px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--surface2);color:var(--muted);font-size:12px;font-weight:800;cursor:pointer;transition:all .15s;}
  .sz-pill.sel{background:var(--accent);color:#002a1a;border-color:var(--accent);}
  .tb-sep{width:1px;height:24px;background:var(--line2);flex:0 0 1px;margin:0 2px;}
  .tb-label{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;flex:0 0 auto;}

  /* Quick actions */
  .quick-actions{display:flex;gap:5px;padding:8px 12px;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0;}
  .quick-actions::-webkit-scrollbar{display:none;}
  .qa-btn{flex:0 0 auto;padding:8px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--surface2);color:var(--text2);font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px;transition:all .15s;}
  .qa-btn svg{width:13px;height:13px;}
  .qa-btn.qa-accent{border-color:rgba(0,229,160,.3);color:var(--accent);background:rgba(0,229,160,.08);}
  .qa-btn.draw-active{border-color:rgba(255,79,114,.4);color:var(--danger);background:rgba(255,79,114,.08);}

  /* Bench */
  .squad-section{padding:0 14px 10px;}
  .squad-section-header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 8px;border-bottom:1px solid var(--line);margin-bottom:8px;}

  .bench-player{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:grab;touch-action:none;transition:border-color .15s;margin-bottom:6px;}

  .bp-avatar svg{width:18px;height:18px;opacity:.3;color:var(--muted);}

  .bp-info{flex:1;min-width:0;}

  .bp-sub{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:5px;}
  .bp-pos{font-size:10px;font-weight:800;background:var(--surface2);border:1px solid var(--line2);border-radius:5px;padding:2px 7px;flex:0 0 auto;color:var(--text2);}
  .bp-acts button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .bp-acts button svg{width:14px;height:14px;}

  .bench-drop-zone{min-height:46px;border:1.5px dashed var(--line2);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:6px;transition:border-color .15s,background .15s;}
  .bench-drop-zone.active{border-color:var(--accent);background:rgba(0,229,160,.06);color:var(--accent);}

  .move-btn{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px;display:flex;align-items:center;gap:13px;cursor:pointer;margin-bottom:8px;transition:border-color .15s;}
  .move-btn:active{border-color:var(--accent);}
  .move-btn .move-ico{width:40px;height:40px;border-radius:10px;background:rgba(0,229,160,.1);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .move-btn .move-ico svg{width:20px;height:20px;}
  .move-btn .move-info strong{font-size:15px;font-weight:800;display:block;}
  .move-btn .move-info span{font-size:12px;color:var(--muted);}

  .pitch-save-bar{flex-shrink:0;display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(6,10,15,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line);}

  /* Lineups */
  .lineup-card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:8px;transition:border-color .18s;}
  .lineup-card:active{border-color:rgba(0,229,160,.3);}
  .lineup-card .lc-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .lineup-card .lc-ico{width:42px;height:42px;border-radius:11px;background:rgba(0,229,160,.08);border:1px solid rgba(0,229,160,.18);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:0 0 auto;}
  .lineup-card .lc-ico svg{width:20px;height:20px;}
  .lineup-card .lc-name{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;}
  .lineup-card .lc-meta{font-size:11px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .lineup-card .lc-date{font-size:10px;color:var(--muted);margin-bottom:10px;font-weight:600;}

  /* Draw canvas */
  #drawCanvas{position:absolute;inset:0;z-index:3;border-radius:12px;display:none;touch-action:none;cursor:crosshair;}
  #drawCanvas.active{display:block;}

  /* Toast */
  #toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px);transform:translateX(-50%) translateY(12px);background:var(--surface2);color:var(--text);padding:11px 18px;border-radius:12px;border:1px solid var(--line2);font-size:13px;font-weight:700;z-index:200;opacity:0;pointer-events:none;transition:all .2s ease;box-shadow:0 8px 28px rgba(0,0,0,.55);white-space:nowrap;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

const DB = {

  load(){
    try{ this.players = JSON.parse(localStorage.getItem('tl_players')) || []; }catch(e){ this.players=[]; }
    try{ this.squads  = JSON.parse(localStorage.getItem('tl_squads'))  || []; }catch(e){ this.squads=[]; }
    try{ this.lineups = JSON.parse(localStorage.getItem('tl_lineups')) || []; }catch(e){ this.lineups=[]; }
    try{ this.settings= JSON.parse(localStorage.getItem('tl_settings'))|| {}; }catch(e){ this.settings={}; }
    // Migrate pre-Phase3 players missing new fields
    let migrated=false;
    this.players.forEach(p=>{
      if(!p.fitness){ p.fitness='ok'; migrated=true; }
      if(!p.stats){ p.stats={apps:0,goals:0,assists:0,cleanSheets:0,saves:0,rating:0}; migrated=true; }
      if(!p.form){ p.form=[]; migrated=true; }
      if(p.notes===undefined){ p.notes=''; migrated=true; }
    });
    if(migrated) this.savePlayers();
  },
  savePlayers(){ localStorage.setItem('tl_players', JSON.stringify(this.players)); },
  saveSquads(){ localStorage.setItem('tl_squads', JSON.stringify(this.squads)); },
  saveLineups(){ localStorage.setItem('tl_lineups', JSON.stringify(this.lineups)); },
  saveSettings(){ localStorage.setItem('tl_settings', JSON.stringify(this.settings)); },
  uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
};

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function playerById(id){ return DB.players.find(p=>p.id===id); }
function squadById(id){ return DB.squads.find(s=>s.id===id); }
function lineupById(id){ return DB.lineups.find(l=>l.id===id); }
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2100);
}

/* ============================== NAVIGATION ============================== */
const NAV_SCREENS = ["home","players","squads","lineups"];

function go(screen, opts={}){
  if(opts.push!==false && State.current!==screen){ State.history.push(State.current); }
  State.current = screen;
  render();
}
function back(){
  if(State.history.length){ State.current = State.history.pop(); render(); }
  else { State.current="home"; render(); }
}

document.getElementById('backBtn').addEventListener('click', back);
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{ State.history=[]; go(btn.dataset.nav, {push:false}); });
});

/* ============================== RENDER ROUTER ============================== */
const HEADER = {
  home:{title:"Tactical Lab", back:false, nav:true},
  players:{title:"Players", back:false, nav:true},
  squads:{title:"Squads", back:false, nav:true},
  lineups:{title:"Lineups", back:false, nav:true},
  squadDetail:{title:"Squad", back:true, nav:true},
  playerProfile:{title:"Player Profile", back:true, nav:false},
  comparePlayers:{title:"Compare Players", back:true, nav:false},
  settings:{title:"Settings", back:true, nav:false},
  lineupSelectXI:{title:"Select Matchday Squad", back:true, nav:false},
  pitch:{title:"Matchday Squad", back:true, nav:false},
};

function render(){
  const conf = HEADER[State.current] || HEADER.home;
  const header = document.getElementById('header');
  document.getElementById('title').textContent =
    (State.current==='pitch' && State.builder) ? (State.builder.name||'Matchday Squad') :
    (State.current==='squadDetail' && State._squadId) ? (squadById(State._squadId)?.name||'Squad') :
    (State.current==='playerProfile' && State._playerId) ? (playerById(State._playerId)?.name||'Player') : conf.title;

  // Settings button — hide on settings page itself
  document.getElementById('settingsBtn').style.display = State.current==='settings'?'none':'flex';
  document.getElementById('settingsBtn').onclick = ()=>go('settings');
  header.classList.toggle('has-back', !!conf.back);
  document.getElementById('logoDot').style.display = conf.back ? 'none':'inline-block';
  document.getElementById('bottomNav').classList.toggle('hidden', !conf.nav);

  const ha = document.getElementById('headerAction');
  ha.style.display='none'; ha.onclick=null;
  if(State.current==='players'){ ha.style.display='block'; ha.textContent='+ Add'; ha.onclick=()=>openPlayerSheet(); }
  if(State.current==='squads'){ ha.style.display='block'; ha.textContent='+ New'; ha.onclick=()=>openSquadSheet(); }

  document.querySelectorAll('.nav-btn').forEach(b=>{
    let active=false;
    if(b.dataset.nav==='squads') active = ['squads','squadDetail'].includes(State.current);
    else active = b.dataset.nav===State.current;
    b.classList.toggle('active',active);
  });

  const renderers = {
    home:renderHome, players:renderPlayers, squads:renderSquads, lineups:renderLineups,
    squadDetail:renderSquadDetail, lineupSelectXI:renderLineupSelectXI, pitch:renderPitch,
    playerProfile:renderPlayerProfile, comparePlayers:renderComparePlayers, settings:renderSettings
  };
  const html = (renderers[State.current]||renderHome)();
  const extraCls = State.current==='pitch' ? 'pitch-wrap' : (conf.nav?'':'no-nav');
  wrap.innerHTML = `<section class="screen active ${extraCls}">${html}</section>`;
  const after = afterRender[State.current];
  if(after) after();
}

function imgFallback(img){
  img.style.display='none';
  const p=img.parentNode; if(!p) return;
  p.classList.remove('has-photo');
  if(!p.querySelector('svg')) p.insertAdjacentHTML('beforeend', SILHOUETTE_SVG);

}
function benchAvatar(p){
  if(p && p.photo){

function renderPlayers(){

  let list = DB.players.slice().sort((a,b)=>a.name.localeCompare(b.name));
  if(q) list = list.filter(p=> p.name.toLowerCase().includes(q) || p.position.toLowerCase().includes(q) || (p.nationality||'').toLowerCase().includes(q) || String(p.number).includes(q));
  const hasApi = !!DB.settings?.apiKey;
  return `
    <div class="search-bar">
      ${icon('search')}
      <input id="playerSearch" placeholder="Search players..." value="${esc(State.playerSearch)}" />

}

function confirmDeletePlayer(id){
  const p=playerById(id); if(!p) return;
  openSheet(`
    <h3>Delete player?</h3>
    <p style="color:var(--muted);margin:0 0 18px;font-size:14px;">"${esc(p.name)}" will be removed from the database and all squads.</p>
    <div class="btn-row">
      <button class="btn btn-ghost" id="cancelX">Cancel</button>
      <button class="btn btn-danger" id="confirmX">Delete</button>
    </div>`);
  $('#cancelX').onclick=closeSheet;
  $('#confirmX').onclick=()=>{
    DB.players = DB.players.filter(x=>x.id!==id);
    DB.squads.forEach(s=> s.playerIds = s.playerIds.filter(pid=>pid!==id));
    DB.lineups.forEach(l=>{ l.xi=(l.xi||[]).filter(x=>x!==id); l.bench=(l.bench||[]).filter(x=>x!==id); l.reserves=(l.reserves||[]).filter(x=>x!==id); if(l.positions) delete l.positions[id]; });
    DB.savePlayers(); DB.saveSquads(); DB.saveLineups();
    closeSheet(); render(); toast('Player deleted');
  };
}

      if(onSaved) onSaved(np.id); else { render(); }
      toast('Player added');
    }

function setupNationalityCombo(input, listEl){
  let hl=-1, filtered=[];
  function refresh(){
    const q=input.value.trim().toLowerCase();
    filtered=COUNTRIES.filter(c=>c.toLowerCase().includes(q)).slice(0,80);
    if(!filtered.length){ listEl.innerHTML=`<div class="combo-empty">No countries found</div>`; }
    else { listEl.innerHTML=filtered.map((c,i)=>`<div class="combo-opt ${i===hl?'hl':''}" data-c="${esc(c)}">${esc(c)}</div>`).join(''); }
    listEl.querySelectorAll('.combo-opt').forEach(o=>o.addEventListener('mousedown',e=>{ e.preventDefault(); pick(o.dataset.c); }));
  }
  function pick(c){ input.value=c; listEl.classList.remove('open'); }
  input.addEventListener('focus',()=>{ hl=-1; refresh(); listEl.classList.add('open'); });
  input.addEventListener('input',()=>{ hl=-1; refresh(); listEl.classList.add('open'); });
  input.addEventListener('blur',()=>{ setTimeout(()=>listEl.classList.remove('open'),150); });
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); hl=Math.min(hl+1,filtered.length-1); refresh(); scrollHl(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); hl=Math.max(hl-1,0); refresh(); scrollHl(); }
    else if(e.key==='Enter'){ if(filtered[hl]){ e.preventDefault(); pick(filtered[hl]); } }
  });
  function scrollHl(){ const el=listEl.querySelector('.combo-opt.hl'); if(el) el.scrollIntoView({block:'nearest'}); }
}

async function fetchWikiPhoto(wikiTitle){
  if(!wikiTitle) return '';
  try{
    const url='https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(wikiTitle);
    const r=await fetch(url,{headers:{'Accept':'application/json'}});
    if(!r.ok) return '';
    const j=await r.json();
    return j.thumbnail?.source||'';
  }catch(e){ return ''; }
}
async function importDatabase(data){
  if(!data||!Array.isArray(data.players)||!data.players.length){ toast('No players found in file'); return; }
  const squadName=(data.name||'Imported Squad').toString().trim()||'Imported Squad';
  const newPlayerIds=[]; let imported=0; const parsedPlayers=[];
  data.players.forEach(raw=>{
    if(!raw||!raw.name) return;
    const name=String(raw.name).trim();
    let position=String(raw.position||'').toUpperCase().trim();
    if(!POSITIONS.includes(position)) position='CM';
    let nationality=raw.nationality?String(raw.nationality).trim():'';
    if(nationality&&!COUNTRIES.includes(nationality)) nationality='';
    const num=raw.shirtNumber!=null&&raw.shirtNumber!==''?Number(raw.shirtNumber):'';
    const age=raw.age!=null&&raw.age!==''?Number(raw.age):'';
    const club=raw.club?String(raw.club).trim():'';
    const wiki=raw.wiki?String(raw.wiki).trim():'';
    const np={id:DB.uid(),name,number:Number.isFinite(num)?num:'',age:Number.isFinite(age)?age:'',position,nationality,club,photo:'',wiki,fitness:'ok',stats:{apps:0,goals:0,assists:0,cleanSheets:0,saves:0,rating:0},form:[],notes:''};
    parsedPlayers.push(np); imported++;
  });
  parsedPlayers.forEach(np=>{ DB.players.push(np); newPlayerIds.push(np.id); });
  const squad={id:DB.uid(),name:squadName,playerIds:newPlayerIds};
  DB.squads.push(squad); DB.savePlayers(); DB.saveSquads();
  closeSheet(); render();
  toast('Imported '+imported+' players — fetching photos…');
  await Promise.all(parsedPlayers.map(async np=>{
    if(!np.wiki) return;
    const photo=await fetchWikiPhoto(np.wiki);
    if(photo){ const stored=DB.players.find(x=>x.id===np.id); if(stored) stored.photo=photo; }
  }));
  DB.savePlayers(); render(); toast('Photos loaded ✓');
}

/* ============================== FORMATION ============================== */
/* Position compatibility map — which formation roles a player position can fill, in priority order */
const POS_COMPAT = {
  'GK': ['GK'],
  'CB': ['CB','DM','LB','RB'],
  'LB': ['LB','CB','LW','DM'],
  'RB': ['RB','CB','RW','DM'],
  'DM': ['DM','CM','CB'],
  'CM': ['CM','DM','AM','LW','RW'],
  'AM': ['AM','CM','LW','RW','ST'],
  'LW': ['LW','AM','ST','CM'],
  'RW': ['RW','AM','ST','CM'],
  'ST': ['ST','LW','RW','AM'],
};

function smartApplyFormation(b, formationName){
  b.formation = formationName;
  const slots = FORMATIONS[formationName] || [];
  if(!slots.length) return;
  b.positions = b.positions || {};

  const players = b.xi.map(id => ({ id, p: playerById(id) })).filter(x => x.p);
  const n = Math.min(players.length, slots.length);

  // Build cost matrix: cost[playerIdx][slotIdx] = how bad this assignment is (lower = better)
  // 0 = perfect match, 1 = first compat fallback, 2 = second, etc., 99 = no compat
  const cost = players.map(({ p }) => {
    const compat = POS_COMPAT[p.position] || [p.position];
    return slots.map(slot => {
      const idx = compat.indexOf(slot.role);
      return idx === -1 ? 99 : idx;
    });
  });

  // Greedy assignment: repeatedly pick the best available (player, slot) pair
  const assignedPlayers = new Set();
  const assignedSlots = new Set();
  const assignment = {}; // playerId -> slotIdx

  // First pass: assign perfect matches (cost === 0)
  for(let si = 0; si < n; si++){
    for(let pi = 0; pi < players.length; pi++){
      if(assignedPlayers.has(pi) || assignedSlots.has(si)) continue;
      if(cost[pi][si] === 0){
        assignment[players[pi].id] = si;
        assignedPlayers.add(pi);
        assignedSlots.add(si);
        break;
      }
    }
  }

  // Subsequent passes: assign by increasing cost
  for(let targetCost = 1; targetCost <= 99; targetCost++){
    let anyAssigned = false;
    for(let si = 0; si < n; si++){
      if(assignedSlots.has(si)) continue;
      for(let pi = 0; pi < players.length; pi++){
        if(assignedPlayers.has(pi)) continue;
        if(cost[pi][si] === targetCost){
          assignment[players[pi].id] = si;
          assignedPlayers.add(pi);
          assignedSlots.add(si);
          anyAssigned = true;
          break;
        }
      }
    }
    // Stop when all slots filled or no progress
    if(assignedSlots.size >= n) break;
    if(!anyAssigned && targetCost > 5) break;
  }

  // Assign positions based on result
  players.forEach(({ id }) => {
    const slotIdx = assignment[id];
    if(slotIdx !== undefined){
      b.positions[id] = { x: slots[slotIdx].x, y: slots[slotIdx].y };
    } else {
      // Fallback: find any unassigned slot
      for(let si = 0; si < slots.length; si++){
        if(!assignedSlots.has(si)){
          b.positions[id] = { x: slots[si].x, y: slots[si].y };
          assignedSlots.add(si);
          break;
        }
      }
    }
  });
}

function applyFormation(b, formationName, force){
  if(force){
    smartApplyFormation(b, formationName);
  } else {
    b.formation = formationName;
    const slots = FORMATIONS[formationName] || [];
    b.positions = b.positions || {};
    b.xi.forEach((id, idx) => {
      if(!b.positions[id]){
        const slot = slots[idx] || { x:50, y:50 };
        b.positions[id] = { x:slot.x, y:slot.y };
      }
    });
  }
}

function benchPlayerHTML(id, section){
  const p=playerById(id); if(!p) return '';
  return '<div class="bench-player" data-id="'+id+'" data-section="'+section+'" draggable="true">'
    +benchAvatar(p)
    +'<div class="bp-num">'+(p.number!=null&&p.number!==''?'#'+esc(p.number):'—')+'</div>'
    +'<div class="bp-info">'
      +'<div class="bp-name">'+esc(p.name)+'</div>'
      +'<div class="bp-sub"><span>'+esc(p.position)+'</span>'+(p.club?'<span>'+esc(p.club)+'</span>':'')+'</div>'
    +'</div>'
    +'<div class="bp-pos">'+esc(p.position)+'</div>'
    +'<div class="bp-acts">'
      +'<button onclick="openMoveSheet(\''+id+'\',\''+section+'\')" title="Move player"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9l7-7 7 7"/><path d="M5 15l7 7 7-7"/></svg></button>'
    +'</div>'
    +'</div>';
}

afterRender.pitch = ()=>{
  const b=State.builder;
  const pitch=document.getElementById('pitch');
  const pitchBody=document.getElementById('pitchBody');

  /* ---- Phase 2: Drawing state ---- */
  const drawState={
    active:false,
    tool:'arrow',      // arrow | run | freehand | zone | circle | cross
    color:'#2bd576',
    size:3,
    strokes:[],        // saved strokes for undo
    current:null,      // stroke in progress
  };
  // Restore saved strokes if any
  if(b.drawStrokes) drawState.strokes=JSON.parse(JSON.stringify(b.drawStrokes));

  /* ---- Place markers for XI ---- */
  b.xi.forEach(id=>{
    const p=playerById(id); if(!p) return;
    const pos=b.positions[id]||{x:50,y:50};
    const m=document.createElement('div');
    m.className='marker'; m.dataset.id=id;
    m.style.left=pos.x+'%'; m.style.top=pos.y+'%';
    const fl=p.number!=null&&p.number!==''?String(p.number):p.position;
    const dotInner=p.photo
      ? '<img src="'+esc(p.photo)+'" alt="'+esc(p.name)+'" onerror="this.parentNode.classList.remove(\'has-photo\');this.remove();this.parentNode.textContent=\''+fl+'\'" />'
      : fl;
    m.innerHTML='<div class="dot'+(p.photo?' has-photo':'')+'">'+dotInner+'</div>'
      +'<div class="nm">'+esc(p.name)+'</div>'
      +'<div class="pos-lbl">'+esc(p.position)+'</div>';
    pitch.appendChild(m);
    makeMarkerDraggable(m, pitch, pitchBody, b);
  });

  /* Formation chips */
  wrap.querySelectorAll('[data-form]').forEach(c=>c.addEventListener('click',()=>{
    applyFormation(b,c.dataset.form,true); render();
  }));

  /* Quick actions */
  document.getElementById('qaAutoFill')?.addEventListener('click',()=>{
    autoFillXI(b); applyFormation(b,b.formation,true); render(); toast('XI auto-filled');
  });
  document.getElementById('qaClearXI')?.addEventListener('click',()=>{
    b.bench=[...b.bench,...b.xi]; b.xi=[]; b.positions={}; render(); toast('Starting XI cleared');
  });
  document.getElementById('qaResetPos')?.addEventListener('click',()=>{
    applyFormation(b,b.formation,true); render(); toast('Positions reset');
  });
  document.getElementById('qaMoveRes')?.addEventListener('click',()=>{
    // all players not in XI or bench go to reserves
    const all=[...b.xi,...b.bench,...b.reserves];
    const used=new Set([...b.xi,...b.bench]);
    const unused=all.filter(id=>!used.has(id));
    // also add any pool players not yet in any list
    const pool=b.source==='squad'
      ? (squadById(b.squadId)?.playerIds||[])
      : DB.players.map(p=>p.id);
    pool.forEach(id=>{ if(!b.xi.includes(id)&&!b.bench.includes(id)&&!b.reserves.includes(id)) b.reserves.push(id); });
    unused.forEach(id=>{ if(!b.reserves.includes(id)) b.reserves.push(id); });
    render(); toast('Unused players moved to Reserves');
  });
  document.getElementById('qaExport')?.addEventListener('click',()=>exportLineupPNG(b, drawState));

  /* ---- Phase 2: Draw mode toggle ---- */
  const drawBtn=document.getElementById('qaDrawMode');
  const toolbar=document.getElementById('drawToolbar');
  const canvas=document.getElementById('drawCanvas');

  function resizeCanvas(){
    canvas.width=pitch.offsetWidth;
    canvas.height=pitch.offsetHeight;
    redrawStrokes();
  }

  function toggleDrawMode(on){
    drawState.active=on;
    drawBtn.classList.toggle('draw-active',on);
    drawBtn.innerHTML=(on
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="9" cy="7" r="3"/><path d="M3 21v-1a6 6 0 0 1 12 0v1"/><path d="M17 8v6M14 11h6"/></svg> Players'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg> Draw');
    toolbar.classList.toggle('visible',on);
    canvas.classList.toggle('active',on);
    // Enable/disable marker pointer events
    pitch.querySelectorAll('.marker').forEach(m=>{
      m.style.pointerEvents=on?'none':'auto';
    });
    if(on){ resizeCanvas(); toast('Draw mode — tap pitch to annotate'); }
    else { toast('Player mode'); }
  }

  drawBtn.addEventListener('click',()=>toggleDrawMode(!drawState.active));

  /* Toolbar: tools */
  toolbar.querySelectorAll('[data-tool]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      toolbar.querySelectorAll('[data-tool]').forEach(b2=>b2.classList.remove('sel'));
      btn.classList.add('sel');
      drawState.tool=btn.dataset.tool;
    });
  });
  /* Toolbar: colors */
  toolbar.querySelectorAll('[data-color]').forEach(sw=>{
    sw.addEventListener('click',()=>{
      toolbar.querySelectorAll('[data-color]').forEach(s2=>s2.classList.remove('sel'));
      sw.classList.add('sel');
      drawState.color=sw.dataset.color;
    });
  });
  /* Toolbar: sizes */
  toolbar.querySelectorAll('[data-size]').forEach(pill=>{
    pill.addEventListener('click',()=>{
      toolbar.querySelectorAll('[data-size]').forEach(p2=>p2.classList.remove('sel'));
      pill.classList.add('sel');
      drawState.size=Number(pill.dataset.size);
    });
  });
  /* Undo */
  document.getElementById('tbUndo')?.addEventListener('click',()=>{
    if(drawState.strokes.length){ drawState.strokes.pop(); b.drawStrokes=drawState.strokes; redrawStrokes(); }
    else toast('Nothing to undo');
  });
  /* Clear */
  document.getElementById('tbClear')?.addEventListener('click',()=>{
    drawState.strokes=[]; b.drawStrokes=[]; redrawStrokes(); toast('Canvas cleared');
  });

  /* ---- Canvas drawing engine ---- */
  const ctx2=canvas.getContext('2d');

  function getCanvasPoint(e){
    const r=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return {x:(t.clientX-r.left)*(canvas.width/r.width), y:(t.clientY-r.top)*(canvas.height/r.height)};
  }

  function redrawStrokes(){
    if(!ctx2) return;
    ctx2.clearRect(0,0,canvas.width,canvas.height);
    drawState.strokes.forEach(s=>renderStroke(ctx2,s,canvas.width,canvas.height));
  }

  function renderStroke(c,s,W,H){
    c.save();
    c.strokeStyle=s.color; c.fillStyle=s.color;
    c.lineWidth=s.size; c.lineCap='round'; c.lineJoin='round';
    const x1=s.x1*W, y1=s.y1*H, x2=s.x2*W, y2=s.y2*H;

    if(s.tool==='arrow'){
      drawArrow(c,x1,y1,x2,y2,s.size);
    } else if(s.tool==='run'){
      drawCurvedArrow(c,x1,y1,x2,y2,s.size);
    } else if(s.tool==='freehand'){
      const pts=s.points.map(p=>({x:p.x*W,y:p.y*H}));
      if(pts.length<2) return;
      c.beginPath(); c.moveTo(pts[0].x,pts[0].y);
      for(let i=1;i<pts.length;i++) c.lineTo(pts[i].x,pts[i].y);
      c.stroke();
    } else if(s.tool==='zone'){
      const rx=Math.min(x1,x2),ry=Math.min(y1,y2),rw=Math.abs(x2-x1),rh=Math.abs(y2-y1);
      c.globalAlpha=0.22; c.fillRect(rx,ry,rw,rh); c.globalAlpha=1;
      c.lineWidth=s.size; c.strokeRect(rx,ry,rw,rh);
    } else if(s.tool==='circle'){
      const rx=Math.abs(x2-x1)/2, ry2=Math.abs(y2-y1)/2;
      const cx=(x1+x2)/2, cy=(y1+y2)/2;
      c.beginPath(); c.ellipse(cx,cy,rx,ry2,0,0,Math.PI*2);
      c.globalAlpha=0.18; c.fill(); c.globalAlpha=1;
      c.lineWidth=s.size; c.stroke();
    } else if(s.tool==='cross'){
      const r=Math.max(10,Math.min(Math.abs(x2-x1),Math.abs(y2-y1))/2);
      const cx=(x1+x2)/2, cy=(y1+y2)/2;
      c.lineWidth=s.size+1;
      c.beginPath(); c.moveTo(cx-r,cy-r); c.lineTo(cx+r,cy+r); c.stroke();
      c.beginPath(); c.moveTo(cx+r,cy-r); c.lineTo(cx-r,cy+r); c.stroke();
    }
    c.restore();
  }

  function drawArrow(c,x1,y1,x2,y2,size){
    const hw=Math.max(size*3,8), hl=Math.max(size*5,14);
    const angle=Math.atan2(y2-y1,x2-x1);
    const ex=x2-Math.cos(angle)*hl*0.3, ey=y2-Math.sin(angle)*hl*0.3;
    c.beginPath(); c.moveTo(x1,y1); c.lineTo(ex,ey); c.stroke();
    c.beginPath();
    c.moveTo(x2,y2);
    c.lineTo(x2-hl*Math.cos(angle-0.4),y2-hl*Math.sin(angle-0.4));
    c.lineTo(x2-hl*Math.cos(angle+0.4),y2-hl*Math.sin(angle+0.4));
    c.closePath(); c.fill();
  }

  function drawCurvedArrow(c,x1,y1,x2,y2,size){
    const mx=(x1+x2)/2-(y2-y1)*0.35, my=(y1+y2)/2+(x2-x1)*0.35;
    const hw=Math.max(size*3,8), hl=Math.max(size*5,14);
    c.beginPath(); c.moveTo(x1,y1); c.quadraticCurveTo(mx,my,x2,y2);
    c.setLineDash([size*2.5,size*2]); c.stroke(); c.setLineDash([]);
    const angle=Math.atan2(y2-my,x2-mx);
    c.beginPath();
    c.moveTo(x2,y2);
    c.lineTo(x2-hl*Math.cos(angle-0.4),y2-hl*Math.sin(angle-0.4));
    c.lineTo(x2-hl*Math.cos(angle+0.4),y2-hl*Math.sin(angle+0.4));
    c.closePath(); c.fill();
  }

  /* Pointer events on canvas */
  let isDrawing=false, startPt=null;

  canvas.addEventListener('pointerdown',e=>{
    if(!drawState.active) return;
    e.preventDefault(); canvas.setPointerCapture(e.pointerId);
    isDrawing=true;
    const pt=getCanvasPoint(e);
    startPt={x:pt.x/canvas.width, y:pt.y/canvas.height};
    if(drawState.tool==='freehand'){
      drawState.current={tool:'freehand',color:drawState.color,size:drawState.size,points:[startPt]};
    } else {
      drawState.current={tool:drawState.tool,color:drawState.color,size:drawState.size,x1:startPt.x,y1:startPt.y,x2:startPt.x,y2:startPt.y};
    }
  },{passive:false});

  canvas.addEventListener('pointermove',e=>{
    if(!isDrawing||!drawState.current) return;
    e.preventDefault();
    const pt=getCanvasPoint(e);
    const nx=pt.x/canvas.width, ny=pt.y/canvas.height;
    if(drawState.tool==='freehand'){
      drawState.current.points.push({x:nx,y:ny});
    } else {
      drawState.current.x2=nx; drawState.current.y2=ny;
    }
    // Live preview
    redrawStrokes();
    renderStroke(ctx2,drawState.current,canvas.width,canvas.height);
  },{passive:false});

  canvas.addEventListener('pointerup',e=>{
    if(!isDrawing||!drawState.current) return;
    isDrawing=false;
    // Only save if stroke has meaningful size
    const s=drawState.current;
    const hasSize = s.tool==='freehand'
      ? s.points.length>2
      : (Math.abs(s.x2-s.x1)>0.01||Math.abs(s.y2-s.y1)>0.01);
    if(hasSize){ drawState.strokes.push(s); b.drawStrokes=drawState.strokes; }
    drawState.current=null;
    redrawStrokes();
  });

  /* Pitch drop zone for dragging from bench */
  setupPitchDrop(pitch, b);

  /* Bench drop zone */
  setupBenchDrop(document.getElementById('benchDropZone'),'bench', b);
  setupBenchDrop(document.getElementById('reservesDropZone'),'reserves', b);

  /* Wire HTML5 drag events on bench/reserves player cards */
  document.querySelectorAll('.bench-player[draggable]').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      e.dataTransfer.setData('text/plain', card.dataset.id);
      e.dataTransfer.setData('text/section', card.dataset.section);
      e.dataTransfer.effectAllowed='move';
      card.classList.add('dragging');
    });
    card.addEventListener('dragend',()=>card.classList.remove('dragging'));
  });

  /* Touch drag for bench→pitch/bench/reserves on mobile */
  setupTouchDrag(b, pitch);

  /* Save / cancel */
  document.getElementById('saveLineup')?.addEventListener('click',()=>openSaveLineupSheet());
  document.getElementById('cancelPitch')?.addEventListener('click',()=>{ State.builder=null; back(); });
};

/* Auto-fill XI with best-position players */
function autoFillXI(b){
  const pool=[...b.xi,...b.bench,...b.reserves];
  if(!pool.length) return;
  const slots=FORMATIONS[b.formation]||[];
  const needed=Math.min(11,slots.length);
  const used=new Set();
  const xi=[];

  // Pass 1: exact position match
  slots.slice(0,needed).forEach(slot=>{
    if(xi.length>=needed) return;
    const match=pool.find(id=>!used.has(id)&&playerById(id)?.position===slot.role);
    if(match){ xi.push(match); used.add(match); }
  });

  // Pass 2: compatible position match
  slots.slice(0,needed).forEach((slot,si)=>{
    if(xi.length>=needed) return;
    // skip slots already filled in pass 1
    const alreadyFilled=xi.some((id,ii)=>b.positions&&b.positions[id]&&
      Math.abs((b.positions[id].x||0)-slot.x)<1&&Math.abs((b.positions[id].y||0)-slot.y)<1);
    const compat=(POS_COMPAT[slot.role]||[slot.role]).slice(1); // skip exact match (already done)
    for(const altPos of compat){
      const match=pool.find(id=>!used.has(id)&&playerById(id)?.position===altPos);
      if(match){ xi.push(match); used.add(match); break; }
    }
  });

  // Pass 3: fill remaining with anyone
  pool.forEach(id=>{ if(!used.has(id)&&xi.length<needed){ xi.push(id); used.add(id); } });

  const movedToBench=b.xi.filter(id=>!xi.includes(id));
  b.bench=b.bench.filter(id=>!xi.includes(id));
  b.reserves=b.reserves.filter(id=>!xi.includes(id));
  movedToBench.forEach(id=>{ if(!b.bench.includes(id)&&!b.reserves.includes(id)) b.bench.push(id); });
  b.xi=xi;
}

/* Draggable markers on pitch */
function makeMarkerDraggable(marker, pitch, pitchBody, b){
  let dragging=false, startX,startY,baseLeft,baseTop,rect,longPressTimer;

  function onDown(e){
    rect=pitch.getBoundingClientRect();
    const pt=getPoint(e);
    startX=pt.x; startY=pt.y;
    baseLeft=parseFloat(marker.style.left); baseTop=parseFloat(marker.style.top);
    longPressTimer=setTimeout(()=>{
      dragging=true; marker.classList.add('dragging');
      marker.setPointerCapture?.(e.pointerId);
    },120);
    e.preventDefault();
  }
  function onMove(e){
    clearTimeout(longPressTimer);
    if(!dragging) return;
    const pt=getPoint(e);
    let nx=baseLeft+((pt.x-startX)/rect.width)*100;
    let ny=baseTop+((pt.y-startY)/rect.height)*100;
    nx=Math.max(4,Math.min(96,nx)); ny=Math.max(3,Math.min(97,ny));
    marker.style.left=nx+'%'; marker.style.top=ny+'%';
    e.preventDefault();
  }
  function onUp(e){
    clearTimeout(longPressTimer);
    if(!dragging){
      // Tap = open move sheet
      openMoveSheet(marker.dataset.id,'xi');
      return;
    }
    dragging=false; marker.classList.remove('dragging');
    b.positions[marker.dataset.id]={x:parseFloat(marker.style.left),y:parseFloat(marker.style.top)};
    // Check if dropped outside pitch -> move to bench
    if(e && e.type!=='pointercancel'){
      const pt=getPoint(e);
      const pr=pitch.getBoundingClientRect();
      if(pt.x<pr.left||pt.x>pr.right||pt.y<pr.top||pt.y>pr.bottom){
        movePlayer(marker.dataset.id,'xi','bench',b);
        return;
      }
    }
  }
  function getPoint(e){ if(e.touches&&e.touches[0]) return {x:e.touches[0].clientX,y:e.touches[0].clientY}; return {x:e.clientX,y:e.clientY}; }
  marker.addEventListener('pointerdown',onDown,{passive:false});
  marker.addEventListener('pointermove',onMove,{passive:false});
  marker.addEventListener('pointerup',onUp);
  marker.addEventListener('pointercancel',onUp);
}

/* Pitch drop zone - accept bench players being dragged */
function setupPitchDrop(pitch, b){
  pitch.addEventListener('dragover',e=>{ e.preventDefault(); pitch.classList.add('drag-over'); });
  pitch.addEventListener('dragleave',()=>pitch.classList.remove('drag-over'));
  pitch.addEventListener('drop',e=>{
    e.preventDefault(); pitch.classList.remove('drag-over');
    const id=e.dataTransfer?.getData('text/plain');
    if(!id) return;
    const rect=pitch.getBoundingClientRect();
    const x=((e.clientX-rect.left)/rect.width)*100;
    const y=((e.clientY-rect.top)/rect.height)*100;
    const from=e.dataTransfer.getData('text/section')||'bench';
    if(b.xi.length<11||from==='xi'){
      movePlayer(id,from,'xi',b);
      b.positions[id]={x:Math.max(4,Math.min(96,x)),y:Math.max(3,Math.min(97,y))};
      render();
    } else { toast('Starting XI is full (11 players max)'); }
  });
}

function setupBenchDrop(zone, section, b){
  zone.addEventListener('dragover',e=>{ e.preventDefault(); zone.classList.add('active'); });
  zone.addEventListener('dragleave',()=>zone.classList.remove('active'));
  zone.addEventListener('drop',e=>{
    e.preventDefault(); zone.classList.remove('active');
    const id=e.dataTransfer?.getData('text/plain');
    const from=e.dataTransfer?.getData('text/section')||'xi';
    if(id) { movePlayer(id,from,section,b); render(); }
  });
}

function movePlayer(id, from, to, b){
  if(from===to) return;
  // Remove from source
  if(from==='xi'){ b.xi=b.xi.filter(x=>x!==id); delete b.positions[id]; }
  else if(from==='bench') b.bench=b.bench.filter(x=>x!==id);
  else if(from==='reserves') b.reserves=b.reserves.filter(x=>x!==id);
  // Add to destination
  if(to==='xi'){
    if(b.xi.length>=11){ toast('XI is full'); b.bench.push(id); return; }
    b.xi.push(id);
    const slots=FORMATIONS[b.formation]||[];
    const slot=slots[b.xi.length-1]||{x:50,y:50};
    b.positions[id]={x:slot.x,y:slot.y};
  } else if(to==='bench'){ b.bench.push(id); }
  else if(to==='reserves'){ b.reserves.push(id); }
}

/* ============================== TOUCH DRAG (mobile bench→pitch) ============================== */
function setupTouchDrag(b, pitch){
  const pitchBody = document.getElementById('pitchBody');
  let ghost=null, dragging=null, fromSection=null, startTouch=null, moved=false;

  function createGhost(card){
    const g=card.cloneNode(true);
    g.style.cssText='position:fixed;z-index:999;pointer-events:none;opacity:.85;width:'+card.offsetWidth+'px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);transform:scale(1.04);transition:none;';
    document.body.appendChild(g);
    return g;
  }
  function removeGhost(){ if(ghost){ ghost.remove(); ghost=null; } }

  function getDropTarget(x, y){
    const pitch2=document.getElementById('pitch');
    const pr=pitch2?.getBoundingClientRect();
    if(pr && x>=pr.left&&x<=pr.right&&y>=pr.top&&y<=pr.bottom) return {type:'xi',rect:pr};
    const bz=document.getElementById('benchDropZone');
    const br=bz?.getBoundingClientRect();
    if(br && x>=br.left&&x<=br.right&&y>=br.top&&y<=br.bottom) return {type:'bench'};
    const rz=document.getElementById('reservesDropZone');
    const rr=rz?.getBoundingClientRect();
    if(rr && x>=rr.left&&x<=rr.right&&y>=rr.top&&y<=rr.bottom) return {type:'reserves'};
    return null;
  }

  pitchBody.addEventListener('touchstart',e=>{
    const card=e.target.closest('.bench-player[draggable]');
    if(!card) return;
    startTouch=e.touches[0];
    dragging=card;
    fromSection=card.dataset.section;
    moved=false;
  },{passive:true});

  pitchBody.addEventListener('touchmove',e=>{
    if(!dragging) return;
    const t=e.touches[0];
    if(!moved && Math.abs(t.clientX-startTouch.clientX)<6 && Math.abs(t.clientY-startTouch.clientY)<6) return;
    if(!ghost){ ghost=createGhost(dragging); dragging.style.opacity='0.3'; }
    moved=true;
    ghost.style.left=(t.clientX - ghost.offsetWidth/2)+'px';
    ghost.style.top=(t.clientY - ghost.offsetHeight/2)+'px';

    // Highlight drop targets
    const target=getDropTarget(t.clientX, t.clientY);
    document.getElementById('pitch')?.classList.toggle('drag-over', target?.type==='xi');
    document.getElementById('benchDropZone')?.classList.toggle('active', target?.type==='bench');
    document.getElementById('reservesDropZone')?.classList.toggle('active', target?.type==='reserves');
    e.preventDefault();
  },{passive:false});

  pitchBody.addEventListener('touchend',e=>{
    if(!dragging) return;
    const id=dragging.dataset.id;
    // Clear highlights
    document.getElementById('pitch')?.classList.remove('drag-over');
    document.getElementById('benchDropZone')?.classList.remove('active');
    document.getElementById('reservesDropZone')?.classList.remove('active');

    if(moved && ghost){
      const t=e.changedTouches[0];
      const target=getDropTarget(t.clientX, t.clientY);
      if(target){
        if(target.type==='xi'){
          if(b.xi.length>=11 && fromSection!=='xi'){ toast('XI is full (11 max)'); }
          else {
            const pr=target.rect;
            const x=((t.clientX-pr.left)/pr.width)*100;
            const y=((t.clientY-pr.top)/pr.height)*100;
            movePlayer(id, fromSection, 'xi', b);
            b.positions[id]={x:Math.max(4,Math.min(96,x)), y:Math.max(3,Math.min(97,y))};
            render();
          }
        } else {
          movePlayer(id, fromSection, target.type, b);
          render();
        }
      }
    }
    dragging.style.opacity='';
    removeGhost();
    dragging=null; fromSection=null; moved=false; startTouch=null;
  });
}

/* ============================== EXPORT PNG ============================== */
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

async function loadImage(src){
  return new Promise(res=>{
    const img=new Image(); img.crossOrigin='anonymous';
    img.onload=()=>res(img); img.onerror=()=>res(null);
    img.src=src;
  });
}

async function exportLineupPNG(b, drawState){
  toast('Generating image…');
  const W=800, PAD=28, ROW=58;
  const benchList=b.bench.map(playerById).filter(Boolean);
  const resList=b.reserves.map(playerById).filter(Boolean);
  const PITCH_H=1040;
  const HEADER_H=88;
  const benchH=benchList.length?(44+benchList.length*ROW):0;
  const resH=resList.length?(44+resList.length*ROW):0;
  const FOOTER_H=44;
  const H=PAD+HEADER_H+PITCH_H+benchH+resH+FOOTER_H+PAD;

  const canvas=document.createElement('canvas');
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d');
  const FONT='-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';

  // --- BG ---
  ctx.fillStyle='#0b0f14'; ctx.fillRect(0,0,W,H);

  // --- HEADER ---
  let y=PAD;
  // Accent line
  const grad=ctx.createLinearGradient(PAD,0,W-PAD,0);
  grad.addColorStop(0,'#2bd576'); grad.addColorStop(1,'rgba(43,213,118,0)');
  ctx.fillStyle=grad; ctx.fillRect(PAD,y,W-PAD*2,3); y+=14;
  ctx.fillStyle='#eef3f8'; ctx.font='bold 30px '+FONT; ctx.textAlign='center';
  ctx.fillText(b.name||'Lineup',W/2,y+32); y+=40;
  ctx.fillStyle='#2bd576'; ctx.font='bold 16px '+FONT;
  ctx.fillText(b.formation,W/2-80,y+20);
  ctx.fillStyle='#8a99a8'; ctx.font='14px '+FONT;
  ctx.fillText(b.xi.length+' Starting XI',W/2,y+20);
  ctx.fillText(benchList.length+' Bench · '+resList.length+' Reserves',W/2+90,y+20);
  y+=HEADER_H-40;

  // --- PITCH ---
  const PX=PAD, PY=y, PW=W-PAD*2, PH=PITCH_H;
  // Stripes
  const stripeH=PH/10;
  for(let i=0;i<10;i++){
    ctx.fillStyle=i%2===0?'#1f7a44':'#196a3a';
    ctx.fillRect(PX,PY+i*stripeH,PW,stripeH);
  }
  // Border
  ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=3;
  ctx.strokeRect(PX,PY,PW,PH);
  // Halfway
  ctx.beginPath(); ctx.moveTo(PX,PY+PH/2); ctx.lineTo(PX+PW,PY+PH/2);
  ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=2; ctx.stroke();
  // Centre circle
  ctx.beginPath(); ctx.arc(PX+PW/2,PY+PH/2,PW*0.16,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=2; ctx.stroke();
  // Centre spot
  ctx.beginPath(); ctx.arc(PX+PW/2,PY+PH/2,5,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.fill();
  // Penalty boxes
  ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=2;
  const bw=PW*0.58, bh=PH*0.14, bw2=PW*0.30, bh2=PH*0.065;
  ctx.strokeRect(PX+(PW-bw)/2, PY, bw, bh);
  ctx.strokeRect(PX+(PW-bw)/2, PY+PH-bh, bw, bh);
  ctx.strokeRect(PX+(PW-bw2)/2, PY, bw2, bh2);
  ctx.strokeRect(PX+(PW-bw2)/2, PY+PH-bh2, bw2, bh2);

  // --- PRELOAD PHOTOS ---
  const imgs={};
  await Promise.all([...b.xi,...benchList.map(p=>p.id),...resList.map(p=>p.id)].map(async id=>{
    const p=playerById(id)||{photo:null}; if(!p.photo) return;
    const img=await loadImage(p.photo); if(img) imgs[id]=img;
  }));

  // --- XI MARKERS ---
  const DOT=28;
  b.xi.forEach(id=>{
    const p=playerById(id); if(!p) return;
    const pos=b.positions[id]||{x:50,y:50};
    const cx=PX+(pos.x/100)*PW, cy=PY+(pos.y/100)*PH;
    const label=p.number!=null&&p.number!==''?String(p.number):p.position;

    // Shadow
    ctx.save(); ctx.shadowColor='rgba(0,0,0,0.7)'; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(cx,cy,DOT,0,Math.PI*2);
    ctx.fillStyle='#0b0f14'; ctx.fill(); ctx.restore();

    // Photo or flat fill
    if(imgs[id]){
      ctx.save();
      ctx.beginPath(); ctx.arc(cx,cy,DOT,0,Math.PI*2); ctx.clip();
      ctx.drawImage(imgs[id],cx-DOT,cy-DOT,DOT*2,DOT*2);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(cx,cy,DOT,0,Math.PI*2);
      ctx.fillStyle='#161e28'; ctx.fill();
      ctx.font='bold 15px '+FONT; ctx.textAlign='center'; ctx.fillStyle='#2bd576';
      ctx.fillText(label,cx,cy+5);
    }
    // Ring
    ctx.beginPath(); ctx.arc(cx,cy,DOT,0,Math.PI*2);
    ctx.strokeStyle='#2bd576'; ctx.lineWidth=2.5; ctx.stroke();

    // Name pill
    const last=p.name.split(' ').pop();
    ctx.font='bold 12px '+FONT; ctx.textAlign='center';
    const tw=ctx.measureText(last).width;
    const pw2=tw+12, ph2=18;
    const px2=cx-pw2/2, py2=cy+DOT+5;
    roundRect(ctx,px2,py2,pw2,ph2,4);
    ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillText(last,cx,py2+13);

    // Pos label
    ctx.font='bold 9px '+FONT; ctx.fillStyle='rgba(43,213,118,0.9)';
    ctx.fillText(p.position,cx,py2+26);
  });

  // --- DRAW STROKES composite ---
  if(drawState && drawState.strokes && drawState.strokes.length){
    // Create an offscreen canvas matching pitch dimensions
    const oc=document.createElement('canvas'); oc.width=PW; oc.height=PH;
    const oc2=oc.getContext('2d');
    drawState.strokes.forEach(s=>renderStroke(oc2,s,PW,PH));
    ctx.drawImage(oc,PX,PY);
  }
  y+=PITCH_H;

  // --- BENCH / RESERVES LISTS ---
  async function drawSection(label, list, accentColor){
    if(!list.length) return;
    y+=10;
    // Header bar
    ctx.fillStyle='rgba(255,255,255,0.06)';
    roundRect(ctx,PAD,y,W-PAD*2,36,8); ctx.fill();
    ctx.fillStyle=accentColor; ctx.font='bold 13px '+FONT; ctx.textAlign='left';
    ctx.fillText(label.toUpperCase(),PAD+14,y+24);
    ctx.fillStyle='#8a99a8'; ctx.font='12px '+FONT; ctx.textAlign='right';
    ctx.fillText(list.length+' players',W-PAD-14,y+24);
    y+=36;

    for(let i=0;i<list.length;i++){
      const p=list[i]; const ry=y+i*ROW;
      ctx.fillStyle=i%2===0?'rgba(255,255,255,0.03)':'transparent';
      ctx.fillRect(PAD,ry,W-PAD*2,ROW);

      // Avatar
      const AV=18, ax=PAD+18+AV, ay=ry+ROW/2;
      if(imgs[p.id]){
        ctx.save();
        ctx.beginPath(); ctx.arc(ax,ay,AV,0,Math.PI*2); ctx.clip();
        ctx.drawImage(imgs[p.id],ax-AV,ay-AV,AV*2,AV*2);
        ctx.restore();
        ctx.beginPath(); ctx.arc(ax,ay,AV,0,Math.PI*2);
        ctx.strokeStyle='rgba(43,213,118,0.4)'; ctx.lineWidth=1.5; ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(ax,ay,AV,0,Math.PI*2);
        ctx.fillStyle='#1d2731'; ctx.fill();
        ctx.strokeStyle='#283543'; ctx.lineWidth=1.5; ctx.stroke();
      }

      let tx=ax+AV+12;
      // Number
      if(p.number!=null&&p.number!==''){
        ctx.fillStyle='#2bd576'; ctx.font='bold 15px '+FONT; ctx.textAlign='left';
        ctx.fillText('#'+p.number,tx,ay+5); tx+=36;
      }
      // Name
      ctx.fillStyle='#eef3f8'; ctx.font='bold 15px '+FONT; ctx.textAlign='left';
      ctx.fillText(p.name,tx,ay-5);
      // Sub info
      ctx.fillStyle='#8a99a8'; ctx.font='12px '+FONT;
      const sub=[p.position,p.club].filter(Boolean).join(' · ');
      ctx.fillText(sub,tx,ay+12);

      // Pos badge right
      const badgeW=46,badgeH=22,badgeX=W-PAD-badgeW-4,badgeY=ay-badgeH/2;
      roundRect(ctx,badgeX,badgeY,badgeW,badgeH,6);
      ctx.fillStyle='rgba(43,213,118,0.12)'; ctx.fill();
      ctx.strokeStyle='rgba(43,213,118,0.3)'; ctx.lineWidth=1; ctx.stroke();
      ctx.fillStyle='#2bd576'; ctx.font='bold 11px '+FONT; ctx.textAlign='center';
      ctx.fillText(p.position,badgeX+badgeW/2,ay+5);

      // Row separator
      ctx.fillStyle='rgba(255,255,255,0.04)'; ctx.fillRect(PAD,ry+ROW-1,W-PAD*2,1);
    }
    y+=list.length*ROW;
  }

  await drawSection('Bench',benchList,'#2bd576');
  await drawSection('Reserves',resList,'#8a99a8');

  // --- FOOTER ---
  y+=12;
  ctx.fillStyle='rgba(43,213,118,0.25)'; ctx.fillRect(PAD,y,W-PAD*2,1); y+=14;
  ctx.fillStyle='rgba(43,213,118,0.7)'; ctx.font='bold 13px '+FONT; ctx.textAlign='center';
  ctx.fillText('⚽ Tactical Lab',W/2,y+16);

  // --- DOWNLOAD ---
  const link=document.createElement('a');
  link.download=(b.name||'lineup').replace(/[^a-z0-9]/gi,'_').toLowerCase()+'.png';
  link.href=canvas.toDataURL('image/png');
  link.click();
  toast('PNG saved ✓');
}

function getRatingBars(p){
  const st=p.stats||{};
  const r=Number(st.rating)||0;
  const apps=Math.max(Number(st.apps)||1,1);
  if(p.position==='GK'){
    const cs=Math.min((Number(st.cleanSheets)||0)/apps*10,10);
    return [{label:'Overall Rating',val:r?r.toFixed(1):'-',pct:r*10},{label:'Clean Sheets/Game',val:((Number(st.cleanSheets)||0)/apps).toFixed(2),pct:cs*10}];
  }
  return [
    {label:'Overall Rating',val:r?r.toFixed(1):'-',pct:r*10},
    {label:'Goals/Game',val:((Number(st.goals)||0)/apps).toFixed(2),pct:Math.min((Number(st.goals)||0)/apps*10,10)*10},
    {label:'Assists/Game',val:((Number(st.assists)||0)/apps).toFixed(2),pct:Math.min((Number(st.assists)||0)/apps*10,10)*10}
  ];
}

async function fetchApiStats(p){
  const key=DB.settings?.apiKey;if(!key)return;
  const spin=$('#apiSpin'),dataEl=$('#apiData');
  try{
    const res=await fetch('https://v3.football.api-sports.io/players?search='+encodeURIComponent(p.name)+'&season=2024',{headers:{'x-apisports-key':key}});
    const data=await res.json();
    if(spin)spin.style.display='none';
    const players=data.response;
    if(!players||!players.length){if(dataEl)dataEl.innerHTML='<div style="font-size:12px;color:var(--muted);">No stats found for this player.</div>';return;}
    const match=players.find(r=>r.player.nationality&&r.player.nationality.toLowerCase().includes('algeria'))||players[0];
    const s=match.statistics[0];
    if(dataEl){
      const rows=[
        {l:'League',v:s.league?.name||'-'},
        {l:'Club',v:s.team?.name||'-'},
        {l:'Appearances',v:s.games?.appearences??s.games?.appearances??'-'},
        {l:'Goals',v:s.goals?.total??'-'},
        {l:'Assists',v:s.goals?.assists??'-'},
        {l:'Avg Rating',v:s.games?.rating?parseFloat(s.games.rating).toFixed(2):'-'},
        {l:'Minutes',v:s.games?.minutes!=null?s.games.minutes+' min':'-'},
        {l:'Yellow Cards',v:s.cards?.yellow??'-'},
        {l:'Red Cards',v:s.cards?.red??'-'},
        {l:'Saves',v:s.goals?.saves??'-'},
        {l:'Key Passes',v:s.passes?.key??'-'},
        {l:'Dribbles',v:s.dribbles?.success??'-'},
      ];
      dataEl.innerHTML=rows.map(r=>'<div class="api-row"><span class="ar-l">'+r.l+'</span><span class="ar-v">'+r.v+'</span></div>').join('');
    }
  }catch(e){
    if(spin)spin.style.display='none';
    if(dataEl)dataEl.innerHTML='<div style="font-size:12px;color:var(--muted);">Could not load stats. Check your API key.</div>';
  }
}

  const p1=(State._compareId?playerById(State._compareId):null)||all[0];
  const p2=(State._compareId2?playerById(State._compareId2):null)||all.find(p=>p.id!==p1.id)||all[1];
  const s1=p1.stats||{};const s2=p2.stats||{};
  const cats=[
    {label:'Rating',v1:Number(s1.rating)||0,v2:Number(s2.rating)||0,max:10},
    {label:'Goals',v1:Number(s1.goals)||0,v2:Number(s2.goals)||0,max:Math.max(Number(s1.goals)||0,Number(s2.goals)||0,1)},
    {label:'Assists',v1:Number(s1.assists)||0,v2:Number(s2.assists)||0,max:Math.max(Number(s1.assists)||0,Number(s2.assists)||0,1)},

    {label:'Clean Sheets',v1:Number(s1.cleanSheets)||0,v2:Number(s2.cleanSheets)||0,max:Math.max(Number(s1.cleanSheets)||0,Number(s2.cleanSheets)||0,1)},
  ];

    <select id="cSel1" style="flex:1;padding:11px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:14px;font-weight:700;outline:none;">
