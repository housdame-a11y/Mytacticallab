      ${all.map(p=>'<option value="'+p.id+'"'+(p.id===p2.id?' selected':'')+'>'+esc(p.name)+'</option>').join('')}
    </select>
  </div>
  <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:18px;">
    <div style="text-align:center;">${playerAvatar(p1,"av-md")}<div style="font-size:12px;font-weight:800;margin-top:6px;color:var(--accent);">${esc(p1.name.split(' ').pop())}</div><div style="font-size:11px;color:var(--muted);">${esc(p1.position)}</div></div>
    <div style="width:1px;height:60px;background:var(--line);"></div>
    <div style="text-align:center;">${playerAvatar(p2,"av-md")}<div style="font-size:12px;font-weight:800;margin-top:6px;color:var(--blue);">${esc(p2.name.split(' ').pop())}</div><div style="font-size:11px;color:var(--muted);">${esc(p2.position)}</div></div>
  </div>
  <div style="background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;">
    ${cats.map(c=>{
      const pct1=Math.min(c.v1/c.max*100,100);

      return '<div class="cmp-bar-row">'

}

  <div class="setting-section">
    <h3>About</h3>
    <div class="setting-row" style="cursor:default;">
      <div class="sr-ico" style="background:rgba(0,230,118,.1);color:var(--accent);">${icon('shield')}</div>
      <div class="sr-info"><strong>Tactical Lab</strong><span>Phase 3 · Built for Algerian Football ⚽</span></div>
    </div>
  </div>`;
}

    $('#cxNo').onclick=closeSheet;
    $('#cxYes').onclick=()=>{DB.players=[];DB.squads=[];DB.lineups=[];DB.savePlayers();DB.saveSquads();DB.saveLineups();closeSheet();render();toast('All data cleared');};

/* ============================== API PLAYER SEARCH ============================== */
/* API-Football returns broad positions: Goalkeeper, Defender, Midfielder, Attacker
   We refine using statistics (goals, assists, appearances by position) */
function getTeamFromResult(r){
  return r.statistics?.[0]?.team?.name
    || r.team?.name
    || r.player?.team?.name
    || '';
}

function mapApiPosition(r){
  const p = r.player;
  const s = r.statistics?.[0];
  const broad = (p.position || s?.games?.position || '').toLowerCase().trim();
  const name = (p.name || '').toLowerCase();

  if(broad === 'goalkeeper' || broad === 'g') return 'GK';

  if(broad === 'defender'){
    if(name.includes('left') || name.includes(' lb')) return 'LB';
    if(name.includes('right') || name.includes(' rb')) return 'RB';
    return 'CB';
  }

  if(broad === 'midfielder'){
    if(name.includes('attacking') || name.includes('attack')) return 'AM';
    if(name.includes('defensive') || name.includes('holding') || name.includes('anchor')) return 'DM';
    if(name.includes('left wing') || name.includes('left mid')) return 'LW';
    if(name.includes('right wing') || name.includes('right mid')) return 'RW';
    return 'CM';
  }

  if(broad === 'attacker' || broad === 'forward'){
    if(name.includes('left') || name.includes('lw')) return 'LW';
    if(name.includes('right') || name.includes('rw')) return 'RW';
    return 'ST';
  }

  if(broad.includes('goal')) return 'GK';
  if(broad.includes('defend')) return 'CB';
  if(broad.includes('mid')) return 'CM';
  if(broad.includes('attack') || broad.includes('forward') || broad.includes('strik')) return 'ST';

  return 'CM';
}

function openApiPlayerSearch(){
  const key = DB.settings?.apiKey;
  if(!key){ toast('Add your API key in Settings first'); return; }

  openSheet(`
    <h3>Search Players</h3>
    <div class="search-bar" style="margin-bottom:10px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="apiSearchInput" placeholder="Search by name e.g. Mahrez…" autofocus/>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px;">
      <button class="btn btn-primary btn-sm" id="apiSearchGo" style="flex:1;">Search</button>
    </div>
    <div id="apiSearchResults"></div>
  `);

  const input = $('#apiSearchInput');
  const results = $('#apiSearchResults');

  async function doSearch(){
    const q = input?.value?.trim();
    if(!q || q.length < 2){ toast('Type at least 2 characters'); return; }
    if(!results) return;
    results.innerHTML = '<div style="display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;padding:12px 0;"><div class="api-spin"></div>Searching…</div>';

    try{
      let players = [];

      // Strategy 1: /players?search with recent seasons — returns stats INCLUDING team
      for(const season of ['2024','2023','2025']){
        const r1 = await fetch(
          'https://v3.football.api-sports.io/players?search='+encodeURIComponent(q)+'&season='+season,
          {headers:{'x-apisports-key':key}}
        );
        const d1 = await r1.json();
        if(d1.response && d1.response.length){
          players = d1.response;
          break;
        }
      }

      // Strategy 2: /players/profiles — no stats/team but useful as fallback
      if(!players.length){
        const r2 = await fetch(
          'https://v3.football.api-sports.io/players/profiles?search='+encodeURIComponent(q),
          {headers:{'x-apisports-key':key}}
        );
        const d2 = await r2.json();
        if(d2.response && d2.response.length){
          players = d2.response.map(item=>({player:item.player, statistics:item.statistics||[]}));
        }
      }

      if(!players.length){
        results.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:12px 0;text-align:center;">No players found. Try a different name or spelling.</div>';
        return;
      }

      results.innerHTML = '<div style="font-size:11px;color:var(--muted);margin-bottom:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;">'
        +players.length+' result'+(players.length>1?'s':'')+' — tap to add</div>'
        + players.slice(0,20).map((r,i) => apiPlayerCard(r, i)).join('');

      results.querySelectorAll('[data-api-add]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.apiAdd);
          const r = players[idx];
          addPlayerFromApi(r);
          btn.textContent = '✓';
          btn.style.background = 'rgba(0,229,160,.15)';
          btn.style.color = 'var(--accent)';
          btn.style.borderColor = 'rgba(0,229,160,.3)';
          btn.disabled = true;
        });
      });

    } catch(e){
      results.innerHTML = '<div style="color:var(--danger);font-size:13px;padding:12px 0;">Error: '+esc(String(e.message||e))+'. Check your API key in Settings.</div>';
    }
  }

  $('#apiSearchGo')?.addEventListener('click', doSearch);
  input?.addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });
  // Auto-focus
  setTimeout(()=>input?.focus(), 100);
}

function apiPlayerCard(r, idx){
  const p = r.player;
  const s = r.statistics?.[0];
  const pos = mapApiPosition(r);
  const club = getTeamFromResult(r) || '—';
  const league = s?.league?.name || '';
  const nat = p.nationality || '—';
  const age = p.age || '';
  const photo = p.photo || '';
  const name = p.name || [p.firstname, p.lastname].filter(Boolean).join(' ') || '—';
  const rating = s?.games?.rating ? parseFloat(s.games.rating).toFixed(1) : null;
  const apps = s?.games?.appearences || s?.games?.appearances || 0;
  const goals = s?.goals?.total || 0;
  const assists = s?.goals?.assists || 0;
  const alreadyAdded = DB.players.some(x=>x.name===name&&x.nationality===nat);

  return `
  <div style="background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 13px;display:flex;align-items:center;gap:11px;margin-bottom:8px;">
    <div style="width:46px;height:46px;flex:0 0 46px;border-radius:11px;overflow:hidden;background:var(--surface2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;">
      ${photo
        ? '<img src="'+esc(photo)+'" style="width:100%;height:100%;object-fit:cover;object-position:top;" loading="lazy" onerror="this.style.display=\'none\'"/>'
        : '<svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22" style="opacity:.3;color:var(--muted)"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-4.418 3.582-8 8-8s8 3.582 8 8"/></svg>'
      }
    </div>
    <div style="flex:1;min-width:0;">
      <div style="font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(name)}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:5px;align-items:center;flex-wrap:wrap;">
        <span class="tag tag-muted" style="font-size:10px;padding:2px 6px;">${esc(pos)}</span>
        ${nat!=='—'?'<span>'+esc(nat)+'</span>':''}
        ${age?'<span>•</span><span>'+esc(age)+' yrs</span>':''}
        ${club!=='—'?'<span>•</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px;">'+esc(club)+'</span>':''}
      </div>
      <div style="font-size:10px;color:var(--muted);margin-top:3px;display:flex;gap:8px;">
        ${apps?'<span>'+apps+' apps</span>':''}
        ${goals?'<span>'+goals+' goals</span>':''}
        ${assists?'<span>'+assists+' ast</span>':''}
        ${rating?'<span style="color:var(--accent);">★ '+rating+'</span>':''}
        ${league?'<span>'+esc(league)+'</span>':''}
      </div>
    </div>
    <button data-api-add="${idx}" style="flex:0 0 auto;padding:7px 12px;border-radius:8px;border:1px solid ${alreadyAdded?'var(--line2)':'rgba(0,229,160,.3)'};background:${alreadyAdded?'var(--surface2)':'rgba(0,229,160,.08)'};color:${alreadyAdded?'var(--muted)':'var(--accent)'};font-size:12px;font-weight:800;cursor:${alreadyAdded?'default':'pointer'};" ${alreadyAdded?'disabled':''}>
      ${alreadyAdded?'✓':'+ Add'}
    </button>
  </div>`;
}

function addPlayerFromApi(r){
  const p = r.player;
  const s = r.statistics?.[0];
  const pos = mapApiPosition(r);
  const nat = p.nationality || '';
  const validNat = COUNTRIES.includes(nat) ? nat : '';

  // API returns firstname+lastname separately; name field may be empty
  const name = p.name || [p.firstname, p.lastname].filter(Boolean).join(' ') || '';

  // Height: "183 cm" → strip units
  const height = p.height ? parseInt(p.height) || '' : '';

  // Weight: "76 kg" → strip units
  const weight = p.weight ? parseInt(p.weight) || '' : '';

  // Rating is a string e.g. "7.234" → parse as float, round to 1dp, scale to 0-10
  const rawRating = s?.games?.rating ? parseFloat(s.games.rating) : 0;
  const rating = rawRating > 0 ? Math.min(parseFloat(rawRating.toFixed(1)), 10) : 0;

  // Appearances — API typo: "appearences" not "appearances"
  const apps = s?.games?.appearences || s?.games?.appearances || 0;

  // Goals — total field, null-safe
  const goals = s?.goals?.total || 0;

  // Assists — can be null in API response
  const assists = s?.goals?.assists || 0;

  // Saves — only populated for GKs
  const saves = s?.goals?.saves || 0;

  // Clean sheets — not directly returned; estimate from saves if GK
  const cleanSheets = pos === 'GK' ? Math.round(apps * 0.3) : 0; // placeholder

  const np = {
    id: DB.uid(),
    name,
    number: '',
    age: p.age || '',
    height,
    weight,
    position: pos,
    nationality: validNat,
    club: getTeamFromResult(r),
    photo: p.photo || '',
    wiki: '',
    fitness: 'ok',
    stats: { apps, goals, assists, cleanSheets, saves, rating },
    form: [],
    notes: ''
  };

  DB.players.push(np);
  DB.savePlayers();
  toast(name + ' added ✓');
}

/* ============================== INIT ============================== */
DB.load();
render();
</script>
